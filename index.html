<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand El Hajj - Sistem Integrasi Operasional</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-image 0.3s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between p-4">

    <!-- HEADER / LOGO & ADMIN BUTTON -->
    <header class="flex justify-between items-center max-w-6xl mx-auto w-full mb-6">
        <div class="flex items-center space-x-3">
            <img id="app-logo" src="logo.png" alt="Logo" class="h-12 w-12 object-contain bg-white/20 p-1 rounded-xl backdrop-blur-md border border-white/30" onerror="this.src='https://via.placeholder.com/48?text=Logo'">
            <div>
                <h1 class="text-xl font-bold text-white tracking-wide">GRAND EL HAJJ</h1>
                <p class="text-xs text-slate-300">Sistem Integrasi Operasional</p>
            </div>
        </div>
        <button onclick="bukaModalAdmin()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2 px-4 rounded-xl shadow-lg transition flex items-center">
            <i class="fa-solid fa-user-shield mr-2"></i> Menu Admin
        </button>
    </header>

    <!-- CONTENT UTAMA -->
    <main class="max-w-4xl mx-auto w-full bg-white/90 backdrop-blur-md rounded-2xl p-6 shadow-2xl border border-white/40 mb-8">
        
        <!-- PANEL TAMPILAN ADMIN (DISEMBUNYIKAN SECARA DEFAULT) -->
        <div id="panel-admin" class="hidden space-y-6 mb-8 p-4 bg-slate-50 rounded-xl border border-slate-200">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-lg font-bold text-slate-800 flex items-center">
                    <i class="fa-solid fa-sliders text-indigo-600 mr-2"></i> Panel Kontrol Admin
                </h2>
                <button onclick="tutupModalAdmin()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- TOMBOL-TOMBOL PENGATURAN -->
            <div class="flex flex-wrap gap-3">
                <button onclick="mintaAksesGantiLogo()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow transition">
                    <i class="fa-solid fa-image mr-1.5"></i> Ganti Logo
                </button>
                
                <!-- TOMBOL GANTI BACKDROP BARU -->
                <button onclick="mintaAksesGantiBackdrop()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow transition">
                    <i class="fa-solid fa-file-image mr-1.5"></i> Ganti Backdrop
                </button>

                <button onclick="exportKeExcel()" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-semibold py-2 px-3 rounded-lg shadow transition">
                    <i class="fa-solid fa-file-excel mr-1.5 text-emerald-400"></i> Export Excel
                </button>
            </div>

            <!-- INPUT FILE TERSEMBUNYI -->
            <input type="file" id="input-logo-file" accept="image/*" class="hidden" onchange="prosesGantiLogo(event)">
            <input type="file" id="input-backdrop-file" accept="image/*" class="hidden" onchange="prosesGantiBackdrop(event)">

            <!-- MODUL ADMIN: ATUR JADWAL JAM ABSENSI -->
            <div class="bg-white p-5 rounded-xl shadow border border-indigo-200">
                <h3 class="text-sm font-bold text-indigo-900 mb-3 flex items-center">
                    <i class="fa-solid fa-clock mr-2 text-indigo-600"></i> Pengaturan Jam Absensi
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-indigo-50/50 p-4 rounded-lg">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Jam Masuk Mulai</label>
                        <input type="time" id="set-jam-masuk-mulai" value="06:00" class="w-full text-xs p-2 rounded border border-slate-300">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Jam Masuk Akhir</label>
                        <input type="time" id="set-jam-masuk-akhir" value="09:00" class="w-full text-xs p-2 rounded border border-slate-300">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Jam Pulang Mulai</label>
                        <input type="time" id="set-jam-pulang-mulai" value="16:00" class="w-full text-xs p-2 rounded border border-slate-300">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Jam Pulang Akhir</label>
                        <input type="time" id="set-jam-pulang-akhir" value="19:00" class="w-full text-xs p-2 rounded border border-slate-300">
                    </div>
                </div>
                <button onclick="simpanJadwalAbsen()" class="mt-3 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 px-4 rounded-lg transition">
                    Simpan Jam Absensi
                </button>
            </div>
        </div>

        <!-- FORM UTAMA APLIKASI -->
        <div class="text-center py-8">
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Selamat Datang</h2>
            <p class="text-sm text-slate-600 mb-6">Silakan masukkan Kode Unik Anda untuk mengakses sistem</p>
            
            <div class="max-w-xs mx-auto space-y-4">
                <input type="text" id="input-kode-unik" placeholder="Masukkan Kode Unik (misal: 001)" class="w-full text-center text-sm p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="prosesMasuk()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition">
                    MASUK KE SYSTEM
                </button>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="text-center text-xs text-slate-400 py-2">
        &copy; 2026 Grand El Hajj. All rights reserved.
    </footer>

    <!-- ENGINE JAVASCRIPT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD9c5qPl9HGruxNfRvlOoqaxyxe2ZwDoaA",
            authDomain: "aplikasi-grand-el-hajj.firebaseapp.com",
            databaseURL: "https://aplikasi-grand-el-hajj-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "aplikasi-grand-el-hajj",
            storageBucket: "aplikasi-grand-el-hajj.firebasestorage.app",
            messagingSenderId: "205554063779",
            appId: "1:205554063779:web:c8e5de2802ad9824d16216",
            measurementId: "G-NX1GJ7958X"
        };

        const app = initializeApp(firebaseConfig);
        // KONFIGURASI FIX REGION ASIA
        const db = getDatabase(app, firebaseConfig.databaseURL);

        const HOTEL_LAT = -6.175392;
        const HOTEL_LNG = 106.827153;
        const RADIUS_MAKSIMAL_KM = 0.5;

        // BUKA/TUTUP MODAL ADMIN
        window.bukaModalAdmin = function() {
            const pwd = prompt("Masukkan Password Admin:");
            if (pwd === "@dmin@1234#") {
                document.getElementById('panel-admin').classList.remove('hidden');
            } else if (pwd !== null) {
                alert("Password Admin Salah!");
            }
        };

        window.tutupModalAdmin = function() {
            document.getElementById('panel-admin').classList.add('hidden');
        };

        // FITUR GANTI LOGO
        window.mintaAksesGantiLogo = function() {
            document.getElementById('input-logo-file').click();
        };

        window.prosesGantiLogo = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const url = e.target.result;
                document.getElementById('app-logo').src = url;
                localStorage.setItem('custom_logo_url', url);
                alert("Logo berhasil diperbarui!");
            };
            reader.readAsDataURL(file);
        };

        // FITUR GANTI BACKDROP (DENGAN PASSWORD SPECIAL)
        window.mintaAksesGantiBackdrop = function() {
            const pwd = prompt("Masukkan Kata Sandi Khusus Backdrop:");
            if (pwd === "backdrop@1234#") {
                document.getElementById('input-backdrop-file').click();
            } else if (pwd !== null) {
                alert("Kata sandi backdrop salah!");
            }
        };

        window.prosesGantiBackdrop = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 3 * 1024 * 1024) {
                alert("Ukuran gambar terlalu besar! Maksimal 3MB.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result;
                terapkanBackdrop(imageUrl);
                localStorage.setItem('custom_backdrop_url', imageUrl);
                alert("Backdrop berhasil diperbarui!");
            };
            reader.readAsDataURL(file);
        };

        function terapkanBackdrop(url) {
            document.body.style.backgroundImage = `url('${url}')`;
        }

        // LOAD LOGO & BACKDROP DARI LOCALSTORAGE
        window.addEventListener('DOMContentLoaded', () => {
            const savedLogo = localStorage.getItem('custom_logo_url');
            if (savedLogo) {
                document.getElementById('app-logo').src = savedLogo;
            }

            const savedBackdrop = localStorage.getItem('custom_backdrop_url');
            if (savedBackdrop) {
                terapkanBackdrop(savedBackdrop);
            }
        });

        // FUNGSI SIMPAN JADWAL
        window.simpanJadwalAbsen = function() {
            const jadwal = {
                masukMulai: document.getElementById('set-jam-masuk-mulai').value,
                masukAkhir: document.getElementById('set-jam-masuk-akhir').value,
                pulangMulai: document.getElementById('set-jam-pulang-mulai').value,
                pulangAkhir: document.getElementById('set-jam-pulang-akhir').value
            };

            set(ref(db, 'pengaturan/jadwal'), jadwal)
                .then(() => alert("Jadwal absensi berhasil disimpan ke Firebase!"))
                .catch((error) => alert("Gagal menyimpan jadwal: " + error.message));
        };

        window.prosesMasuk = function() {
            const kode = document.getElementById('input-kode-unik').value.trim();
            if (!kode) {
                alert("Harap masukkan kode unik Anda!");
                return;
            }
            alert("Memproses masuk untuk kode: " + kode);
        };

        window.exportKeExcel = function() {
            alert("Fitur Export Excel diaktifkan!");
        };
    </script>
</body>
</html>
